<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KX-7 Decoder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      color: #e8edf3;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(420px, 90vw);
      padding: 32px;
      background: #121821;
      border: 1px solid #273241;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: #8e9aaa; margin-bottom: 24px; }
    .code-display {
      padding: 14px;
      margin-bottom: 18px;
      background: #0b1017;
      border-radius: 10px;
      font-family: monospace;
      color: #9fb3c8;
      word-break: break-all;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #344154;
      border-radius: 9px;
      background: #0b1017;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #5f88b5; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #2f6fed;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #245dcc; }
    #result {
      min-height: 28px;
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 KX-7</h1>
    <div class="subtitle">Enter the sequence to decode it.</div>

    <div class="code-display">[ ⟦KX-7:2683151⟧ ]</div>

    <input id="code" type="text" placeholder="Enter sequence" autocomplete="off">
    <button onclick="decode()">DECODE</button>

    <div id="result"></div>
  </div>

  <script>
    function decode() {
      const code = document.getElementById("code").value.trim();
      const result = document.getElementById("result");

      if (code === "2683151") {
        result.textContent = "Rupsana";
        result.style.color = "#63d391";
      } else {
        result.textContent = "Unknown code.";
        result.style.color = "#ff7070";
      }
    }

    document.getElementById("code").addEventListener("keydown", function(event) {
      if (event.key === "Enter") decode();
    });
  </script>
</body>
</html>
